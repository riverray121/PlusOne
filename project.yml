name: PlusOne
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Automatic signing; the team is pinned here because regenerating the project
    # from this spec discards any selection made in Xcode.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 76DJ96729W
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  PlusOne:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riverray.PlusOne
    sources:
      - Sources/App
      - Sources/Shared
      - Resources
    entitlements:
      path: Entitlements/PlusOne.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.riverray.plusone
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.riverray.PlusOne
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: Info/PlusOne-Info.plist
      properties:
        CFBundleDisplayName: PlusOne
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: "The camera verifies two people are present before unlocking a blocked app. Frames are analyzed on-device and never stored."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        CKSharingSupported: true
    dependencies:
      - target: ShieldUIExtension
      - target: ShieldActionExtension
      - target: MonitorExtension

  ShieldUIExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riverray.PlusOne.ShieldUIExtension
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Sources/ShieldUI
      - Sources/Shared
      - Resources
    entitlements:
      path: Entitlements/ShieldUIExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.riverray.plusone
    info:
      path: Info/ShieldUIExtension-Info.plist
      properties:
        CFBundleDisplayName: PlusOne Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [NotificationIcon]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationProvider

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riverray.PlusOne.ShieldActionExtension
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Sources/ShieldAction
      - Sources/Shared
      - Resources
    entitlements:
      path: Entitlements/ShieldActionExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.riverray.plusone
    info:
      path: Info/ShieldActionExtension-Info.plist
      properties:
        CFBundleDisplayName: PlusOne Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [NotificationIcon]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionProvider

  MonitorExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riverray.PlusOne.MonitorExtension
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Sources/Monitor
      - Sources/Shared
      - Resources
    entitlements:
      path: Entitlements/MonitorExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.riverray.plusone
    info:
      path: Info/MonitorExtension-Info.plist
      properties:
        CFBundleDisplayName: PlusOne Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [NotificationIcon]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SessionMonitor

schemes:
  PlusOne:
    build:
      targets:
        PlusOne: all
    run:
      config: Debug
    archive:
      config: Release
